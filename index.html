<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astras Search - 极简搜索</title>
    <meta name="description" content="Astras Search - 聚合多引擎的极简搜索入口，个人学习实验项目">
    <style>
        :root {
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #c3cfe2;
            --container-bg: rgba(255,255,255,0.92);
            --text-primary: #1e1e1e;
            --text-secondary: #5f6368;
            --text-muted: #888;
            --border-color: rgba(0,0,0,0.08);
            --hover-bg: rgba(0,0,0,0.05);
            --accent: #4285f4;
            --accent-hover: #3367d6;
            --shadow: 0 12px 32px rgba(0,0,0,0.10);
            --suggestion-bg: rgba(255,255,255,0.98);
            --danger: #dc3545;
            --success: #28a745;
        }

        [data-theme="dark"] {
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e293b;
            --container-bg: rgba(30,41,59,0.92);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(255,255,255,0.08);
            --hover-bg: rgba(255,255,255,0.05);
            --accent: #60a5fa;
            --accent-hover: #3b82f6;
            --shadow: 0 12px 32px rgba(0,0,0,0.30);
            --suggestion-bg: rgba(30,41,59,0.98);
            --danger: #f87171;
            --success: #4ade80;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 16px 24px;
            gap: 12px;
            z-index: 100;
        }

        .top-bar a, .top-bar button {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .top-bar a:hover, .top-bar button:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        .theme-toggle {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .center-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            transition: all 0.3s ease;
            padding: 0 20px;
        }

        .logo {
            font-size: 42px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -1px;
            margin-bottom: 8px;
            transition: color 0.3s;
        }

        .tagline {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 560px;
        }

        .search-box {
            display: flex;
            background: var(--container-bg);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 7px 7px 7px 20px;
            box-shadow: var(--shadow);
            width: 100%;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .search-box:focus-within {
            box-shadow: 0 12px 40px rgba(66,133,244,0.15);
            border-color: rgba(66,133,244,0.3);
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 17px;
            padding: 12px 4px;
            outline: none;
            color: var(--text-primary);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-box button {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0 16px;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .search-box button:hover { background: var(--hover-bg); }

        .search-box button svg {
            width: 22px;
            height: 22px;
            fill: var(--text-secondary);
        }

        .engine-tabs {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .engine-tab {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--container-bg);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
        }

        .engine-tab:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        .engine-tab.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .suggestions {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--suggestion-bg);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            max-height: 300px;
            overflow-y: auto;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: all 0.2s;
            z-index: 50;
        }

        .suggestions.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .suggestion-item {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
            font-size: 15px;
            transition: background 0.15s;
        }

        .suggestion-item:first-child { border-radius: 16px 16px 0 0; }
        .suggestion-item:last-child { border-radius: 0 0 16px 16px; }
        .suggestion-item:hover, .suggestion-item.selected { background: var(--hover-bg); }
        .suggestion-item svg { width: 16px; height: 16px; fill: var(--text-muted); flex-shrink: 0; }

        .shortcut-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-muted);
            font-size: 12px;
            opacity: 0.7;
        }

        .shortcut-hint kbd {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 2px 6px;
            font-family: monospace;
            font-size: 11px;
        }

        .footer-links {
            position: fixed;
            bottom: 20px;
            right: 24px;
            display: flex;
            gap: 16px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            transition: color 0.2s;
        }

        .footer-links a:hover { color: var(--text-primary); }

        .backend-status {
            position: fixed;
            top: 16px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            z-index: 100;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background 0.3s;
        }

        .status-dot.online { background: var(--success); }
        .status-dot.offline { background: var(--danger); }

        @media (max-width: 600px) {
            .logo { font-size: 32px; }
            .search-box { padding: 5px 5px 5px 16px; }
            .search-box input { font-size: 16px; padding: 10px 2px; }
            .engine-tab { padding: 6px 14px; font-size: 12px; }
            .footer-links { bottom: 12px; right: 16px; }
            .shortcut-hint { display: none; }
            .backend-status { display: none; }
        }
    </style>
</head>
<body>
    <div class="backend-status" id="backendStatus">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">检查后端...</span>
    </div>

    <div class="top-bar">
        <a href="privacy.html">隐私政策</a>
        <a href="terms.html">免责声明</a>
        <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
            <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
    </div>

    <div class="center-container">
        <div class="logo">Astras Search</div>
        <div class="tagline">聚合多引擎 · 极简搜索体验</div>

        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="输入关键词，按 Enter 搜索..." autocomplete="off">
                <button onclick="doSearch()" title="搜索">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </button>
            </div>
            <div class="suggestions" id="suggestions"></div>
        </div>

        <div class="engine-tabs">
            <button class="engine-tab active" data-engine="google">Google</button>
            <button class="engine-tab" data-engine="bing">Bing</button>
            <button class="engine-tab" data-engine="baidu">百度</button>
            <button class="engine-tab" data-engine="sogou">搜狗</button>
            <button class="engine-tab" data-engine="so">360</button>
            <button class="engine-tab" data-engine="sm">神马</button>
            <button class="engine-tab" data-engine="duckduckgo">DuckDuckGo</button>
            <button class="engine-tab" data-engine="yandex">Yandex</button>
        </div>
    </div>

    <div class="shortcut-hint">
        <kbd>Ctrl</kbd> + <kbd>K</kbd> 聚焦 · <kbd>↑</kbd><kbd>↓</kbd> 选择建议 · <kbd>Esc</kbd> 关闭
    </div>

    <div class="footer-links">
        <a href="https://github.com/ningqi24/search.astras" target="_blank">GitHub</a>
        <a href="privacy.html">隐私</a>
        <a href="terms.html">条款</a>
    </div>

    <script>
        // ==================== 配置 ====================
        const CONFIG = {
            // 后端 API 地址（部署时修改为你的后端域名）
            API_BASE: 'http://localhost:3000',
            // 是否启用后端建议（false 则使用本地模拟）
            USE_BACKEND: true,
            // 建议请求防抖延迟（毫秒）
            DEBOUNCE_DELAY: 200,
        };

        // ==================== 搜索引擎配置 ====================
        const engines = {
            google: 'https://www.google.com/search?q=',
            bing: 'https://www.bing.com/search?q=',
            baidu: 'https://www.baidu.com/s?wd=',
            sogou: 'https://www.sogou.com/web?query=',
            so: 'https://www.so.com/s?q=',
            sm: 'https://m.sm.cn/s?q=',
            duckduckgo: 'https://duckduckgo.com/?q=',
            yandex: 'https://yandex.com/search/?text='
        };

        let currentEngine = 'google';
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestions');
        let selectedIndex = -1;
        let debounceTimer = null;

        // ==================== 后端状态检测 ====================
        async function checkBackend() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 3000);

                const res = await fetch(`${CONFIG.API_BASE}/api/health`, { 
                    signal: controller.signal 
                });
                clearTimeout(timeout);

                if (res.ok) {
                    dot.className = 'status-dot online';
                    text.textContent = '后端在线';
                    CONFIG.USE_BACKEND = true;
                } else {
                    throw new Error('Health check failed');
                }
            } catch (e) {
                dot.className = 'status-dot offline';
                text.textContent = '后端离线（使用本地模式）';
                CONFIG.USE_BACKEND = false;
            }
        }

        // 页面加载时检测后端
        checkBackend();

        // ==================== 主题切换 ====================
        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

        // ==================== 引擎切换 ====================
        document.querySelectorAll('.engine-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.engine-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentEngine = tab.dataset.engine;
            });
        });

        // ==================== 搜索执行 ====================
        function doSearch() {
            const query = searchInput.value.trim();
            if (!query) return;
            const url = engines[currentEngine] + encodeURIComponent(query);
            window.open(url, '_blank');
            suggestionsBox.classList.remove('show');
        }

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (selectedIndex >= 0) {
                    const items = suggestionsBox.querySelectorAll('.suggestion-item');
                    if (items[selectedIndex]) {
                        setSearch(items[selectedIndex].textContent.trim());
                        return;
                    }
                }
                doSearch();
            }
        });

        // ==================== 快捷键 ====================
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
            if (e.key === 'Escape') {
                suggestionsBox.classList.remove('show');
                searchInput.blur();
                selectedIndex = -1;
            }
            if (e.key === 'ArrowDown' && suggestionsBox.classList.contains('show')) {
                e.preventDefault();
                const items = suggestionsBox.querySelectorAll('.suggestion-item');
                selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
                updateSelection(items);
            }
            if (e.key === 'ArrowUp' && suggestionsBox.classList.contains('show')) {
                e.preventDefault();
                selectedIndex = Math.max(selectedIndex - 1, 0);
                updateSelection(suggestionsBox.querySelectorAll('.suggestion-item'));
            }
        });

        function updateSelection(items) {
            items.forEach((item, i) => {
                item.classList.toggle('selected', i === selectedIndex);
            });
        }

        // ==================== 搜索建议 ====================
        // 本地模拟建议（后端不可用时回退）
        const localSuggestions = [
            '天气', '翻译', '地图', '新闻', '股票',
            '视频', '图片', '学术', '购物', '百科'
        ];

        async function fetchSuggestions(query) {
            if (!CONFIG.USE_BACKEND) {
                // 本地模式
                return localSuggestions.filter(s => 
                    s.includes(query) || query.includes(s)
                );
            }

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 2000);

                const res = await fetch(
                    `${CONFIG.API_BASE}/api/suggest?q=${encodeURIComponent(query)}`,
                    { signal: controller.signal }
                );
                clearTimeout(timeout);

                if (!res.ok) throw new Error('Backend error');
                const data = await res.json();
                return data.suggestions || [];
            } catch (e) {
                // 后端失败时回退到本地
                return localSuggestions.filter(s => 
                    s.includes(query) || query.includes(s)
                );
            }
        }

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            selectedIndex = -1;

            if (debounceTimer) clearTimeout(debounceTimer);

            if (!val) {
                suggestionsBox.classList.remove('show');
                return;
            }

            debounceTimer = setTimeout(async () => {
                const suggestions = await fetchSuggestions(val);

                if (suggestions.length > 0) {
                    suggestionsBox.innerHTML = suggestions.map((s, i) => 
                        `<div class="suggestion-item" data-index="${i}">
                            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                            ${s}
                        </div>`
                    ).join('');

                    suggestionsBox.querySelectorAll('.suggestion-item').forEach(item => {
                        item.addEventListener('click', () => {
                            setSearch(item.textContent.trim());
                        });
                    });

                    suggestionsBox.classList.add('show');
                } else {
                    suggestionsBox.classList.remove('show');
                }
            }, CONFIG.DEBOUNCE_DELAY);
        });

        function setSearch(text) {
            searchInput.value = text;
            suggestionsBox.classList.remove('show');
            selectedIndex = -1;
            doSearch();
        }

        // 点击外部关闭建议
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                suggestionsBox.classList.remove('show');
                selectedIndex = -1;
            }
        });
    </script>
</body>
</html>
